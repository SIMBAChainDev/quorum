name: Release
on:
  workflow_dispatch:
    tags:
      - 'v*'
  push:
    tags:
      - 'v*'
env:
  GO_VERSION: 1.25.x
  GOPATH: ${{ github.workspace }}/go
  WORKING_DIR: ${{ github.workspace }}/go/src/github.com/ethereum/go-ethereum
jobs:
  publish-docker:
    name: Publish Docker Images
    runs-on: ubuntu-24.04
    steps:
      - name: 'Check out project files'
        uses: actions/checkout@v4
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 'Extract Docker Image Tag'
        id: extract
        run: |
          REF=${{ github.ref }}
          echo ::set-output name=image_tag::$(echo $REF | sed 's/refs\/tags\/v//g')
          echo ::set-output name=image_tag_minor_latest::$(echo $REF | sed -e 's/refs\/tags\/v//g' -e 's/^\([[:digit:]]*\.[[:digit:]]*\).*/\1/')
      - name: 'Log in to Docker Hub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: 'Build and push image to Docker Hub'
        id: build
        run: |
          docker buildx build --push --platform linux/amd64 \
            --build-arg DD_GIT_COMMIT_SHA=${{ github.sha }} \
            -t ${{ secrets.DOCKER_REPO }}:latest -t ${{ secrets.DOCKER_REPO }}:${{ steps.extract.outputs.image_tag }} -t ${{ secrets.DOCKER_REPO }}:${{ steps.extract.outputs.image_tag_minor_latest }} .
  build-binary:
    name: 'Build binary for ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-24.04" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 'Setup Go ${{ env.GO_VERSION }}'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: 'Prepare environment'
        id: env
        run: |
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "key=$(go env GOOS)_$(go env GOARCH)" >> $GITHUB_OUTPUT
          echo "version=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT
      - name: 'Check out project files'
        uses: actions/checkout@v4
        with:
          path: ${{ env.WORKING_DIR }}
      - name: 'Build geth'
        id: build
        working-directory: ${{ env.WORKING_DIR }}
        run: |-
          mkdir -p build/artifact
          base=build/artifact/geth_${{ steps.env.outputs.version }}_${{ steps.env.outputs.key }}

          # Default (dynamically linked) build — the existing release asset.
          make geth
          cp build/bin/geth ${base}
          chmod +x ${base}
          echo "bin_file=${base}" >> $GITHUB_OUTPUT
          echo "checksum=$(shasum -a 256 build/bin/geth | awk '{print $1}')" >> $GITHUB_OUTPUT

          # Statically linked build — no glibc version dependency, so it runs
          # on hosts with an older glibc than the runner (e.g. RHEL9 / glibc 2.34).
          go run build/ci.go install -static ./cmd/geth
          cp build/bin/geth ${base}_static
          chmod +x ${base}_static
          echo "static_bin_file=${base}_static" >> $GITHUB_OUTPUT
          echo "static_checksum=$(shasum -a 256 build/bin/geth | awk '{print $1}')" >> $GITHUB_OUTPUT
      - name: 'Verify binary'
        working-directory: ${{ env.WORKING_DIR }}
        run: |-
          actual_checksum=$(shasum -a 256 ${{ steps.build.outputs.bin_file }} | awk '{print $1}')
          echo "Checksum: ${actual_checksum}"
          if [ "${{ steps.build.outputs.checksum }}" != "${actual_checksum}" ]; then
            echo "::error::geth checksum validation fails"
            exit 1
          fi
          actual_static_checksum=$(shasum -a 256 ${{ steps.build.outputs.static_bin_file }} | awk '{print $1}')
          echo "Static checksum: ${actual_static_checksum}"
          if [ "${{ steps.build.outputs.static_checksum }}" != "${actual_static_checksum}" ]; then
            echo "::error::static geth checksum validation fails"
            exit 1
          fi
          # Fail the release if the static asset silently regresses to dynamic linking.
          file ${{ steps.build.outputs.static_bin_file }}
          if ! file ${{ steps.build.outputs.static_bin_file }} | grep -q 'statically linked'; then
            echo "::error::static geth is not statically linked"
            exit 1
          fi
          if ldd ${{ steps.build.outputs.static_bin_file }} 2>&1 | grep -qvE 'not a dynamic executable|statically linked'; then
            echo "::error::static geth has dynamic library dependencies"
            exit 1
          fi
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.WORKING_DIR }}/build/artifact
          name: ${{ steps.env.outputs.key }}
          if-no-files-found: error
  draft-release:
    if: always()
    name: 'Draft Github release'
    needs:
      - build-binary
      - publish-docker
    runs-on: ubuntu-24.04
    steps:
      - name: 'Check out project files'
        uses: actions/checkout@v4
      - name: 'Download binary artifact'
        uses: actions/download-artifact@v4
        with:
          name: linux_amd64
          path: artifact
      - name: 'Generate release notes'
        id: release_notes
        run: |
          git fetch --depth=1 origin +refs/tags/*:refs/tags/*
          file="generated-release-notes.md"
          current_version="${GITHUB_REF##*/}"
          last_version=$(git describe --abbrev=0 --tags `git rev-list --tags --skip=1  --max-count=1`)
          last_release_date=$(git log -1 --format=%cd --date=short $last_version)
          echo "Last version: $last_version on $last_release_date"
          # commit log since last tag
          git log --pretty=format:'* %s (%h)' "${last_version}..HEAD" >> $file
          content=$(cat $file)
          # escape newline
          content="${content//'%'/'%25'}"
          content="${content//$'\n'/'%0A'}"
          content="${content//$'\r'/'%0D'}"
          echo "::set-output name=content::$content"
      - name: 'Create Github draft release'
        uses: actions/create-release@v1
        env:
          # This token is provided by Actions, you do not need to create your own token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            ${{ steps.release_notes.outputs.content }}
          draft: true
          prerelease: false
      - name: 'Upload binary to release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} artifact/geth_* --repo ${{ github.repository }}
