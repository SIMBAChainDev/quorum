# This file configures github.com/golangci/golangci-lint (v2 configuration schema).

version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - bidichk
    - durationcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck # also covers the former gosimple and stylecheck linters
    - unconvert
    - unused
    - whitespace

    # quorum: goconst disabled pending cleanup of the existing backlog (~150 hits,
    #   mostly in tests) surfaced when the linter was upgraded. Re-enable once addressed.
    # - goconst
    # - structcheck # lots of false positives
    # - errcheck #lot of false positives
    # - contextcheck
    # - errchkjson # lots of false positives
    # - errorlint # this check crashes
    # - exhaustive # silly check
    # - makezero # false positives
    # - nilerr # several intentional

  settings:
    govet:
      disable:
        # 'inline' only reports //go:fix migration hints (io/ioutil -> os, reflect.Ptr -> reflect.Pointer)
        # and its output depends on the local toolchain version. Covered by the io/ioutil waiver below.
        - inline
    staticcheck:
      # SA* (staticcheck) and S* (former gosimple) only; the stylecheck (ST*) and quickfix (QF*)
      # classes were never enabled here and are excluded to keep parity with the previous config.
      checks:
        - all
        - -ST*
        - -QF*

  exclusions:
    # Equivalent of the v1 default exclusion set (exclude-use-default: true).
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    paths:
      - core/genesis_alloc.go
      - crypto/bls12381/arithmetic_fallback.go # generated by goff, DO NOT EDIT marker is not at the top of the file
    rules:
      - path: crypto/bn256/cloudflare/optate.go
        linters:
          - staticcheck
      - path: internal/build/pgp.go
        text: 'SA1019: "?golang\.org/x/crypto/openpgp"? (is|has been) deprecated'
      - path: core/vm/contracts.go
        text: 'SA1019: "?golang\.org/x/crypto/ripemd160"? (is|has been) deprecated'
      - path: accounts/usbwallet/trezor.go
        text: 'SA1019: "?github\.com/golang/protobuf/proto"? (is|has been) deprecated'
      - path: accounts/usbwallet/trezor/
        text: 'SA1019: "?github\.com/golang/protobuf/proto"? (is|has been) deprecated'
      - path: plugin/account/internal/testutils/matchers.go
        text: 'SA1019: "?github\.com/golang/protobuf/proto"? (is|has been) deprecated'
      - path: rpc/
        text: 'SA1019: "?github\.com/golang/protobuf/proto"? (is|has been) deprecated'
      - path: rpc/
        text: 'SA1019: "?github\.com/golang/protobuf/ptypes"? (is|has been) deprecated'
      - path: metrics/sample_test.go
        text: 'SA1019: rand.Seed has been deprecated since Go 1.20'
        linters:
          - staticcheck
      - text: 'SA1019: .*event.TypeMux is deprecated: use Feed'
        linters:
          - staticcheck
      - text: 'SA1019: strings.Title is deprecated'
        linters:
          - staticcheck
      - text: 'SA1019: strings.Title has been deprecated since Go 1.18 and an alternative has been available since Go 1.0: The rule Title uses for word boundaries does not handle Unicode punctuation properly. Use golang.org/x/text/cases instead.'
        linters:
          - staticcheck
      - text: 'SA1029: should not use built-in type string as key for value'
        linters:
          - staticcheck
      # quorum: ignore due to large number of changes required to remedy. ioutil now only operates as a simple delegate for the preferred os and io packages anyway.
      #   If we want to correctly resolve these lint issues, upstream PR https://github.com/ethereum/go-ethereum/pull/24869 can provide guidance.
      - text: 'SA1019: "?io/ioutil"? (is|has been) deprecated'
        linters:
          - staticcheck
      # quorum: deprecations surfaced by the linter upgrade, waived pending a dedicated migration:
      #   crypto/elliptic Marshal/Unmarshal/ScalarMult/... -> crypto/ecdh or the secp256k1 package
      #   github.com/docker/docker/pkg/reexec -> vendored copy or os/exec
      #   reflect.SliceHeader -> unsafe.Slice, runtime.GOROOT -> go env, math/rand.Seed -> rand.New
      - text: 'SA1019: (crypto/elliptic\.|\(crypto/elliptic\.Curve\)\.)'
        linters:
          - staticcheck
      - text: 'SA1019: github.com/docker/docker/pkg/reexec'
        linters:
          - staticcheck
      - text: 'SA1019: reflect.SliceHeader (is|has been) deprecated'
        linters:
          - staticcheck
      - text: 'SA1019: runtime.GOROOT (is|has been) deprecated'
        linters:
          - staticcheck
      - text: 'SA1019: math/rand.Seed has been deprecated'
        linters:
          - staticcheck
      - text: 'SA1019: (go/parser.ParseDir|\(net/http.Transport\).DialTLS) (is|has been) deprecated'
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
